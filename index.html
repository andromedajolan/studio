<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141418">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Studio</title>
<style>:root{--bg:#0b0b0e;--p1:#141418;--p2:#1b1b21;--p3:#26262e;--ln:#2f2f3a;--tx:#ececf2;--dim:#8f8fa0;--ac:#4cc2ff;--rec:#ff4d5e;--ok:#3ddc97;--warn:#ffb74d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.3 system-ui,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--p3);border:1px solid var(--ln);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:#32323d}button.on{background:var(--ac);color:#04121a;border-color:var(--ac)}
button:disabled{opacity:.35;cursor:default}
a.btnlink{font:inherit;color:inherit;background:var(--p3);border:1px solid var(--ln);border-radius:6px;padding:5px 9px;text-decoration:none;white-space:nowrap}a.btnlink:hover{background:#32323d}
input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:54px 1fr;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--ln);overflow-x:auto;white-space:nowrap}
#top .grp{display:flex;align-items:center;gap:4px;padding:0 6px;border-left:1px solid var(--ln)}
#top .grp:first-child{border:0}
#projBtn{max-width:200px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#play{width:42px;font-size:16px}#rec{color:var(--rec)}#rec.on{background:var(--rec);color:#fff;border-color:var(--rec)}
#time{width:124px;text-align:center;font:600 20px ui-monospace,Menlo,monospace;background:#000;border:1px solid var(--ln);border-radius:6px;padding:3px 4px;color:var(--ac)}
#mem{display:flex;flex-direction:column;gap:2px;width:120px;font-size:11px;color:var(--dim)}
#memBar{height:6px;background:var(--p3);border-radius:3px;overflow:hidden}#memFill{height:100%;width:0;background:var(--ok);transition:width .3s}
#meter{width:90px;height:10px;background:var(--p3);border-radius:3px;position:relative;overflow:hidden}#meterFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ok) 70%,var(--warn) 88%,var(--rec))}
#save{font-size:11px;color:var(--dim);min-width:70px}#save.err{color:var(--rec)}
#main{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:30px 1fr 14px;min-height:0;position:relative}
#corner{background:var(--p1);border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--dim);font-size:11px}
#rulerWrap{position:relative;border-bottom:1px solid var(--ln);background:var(--p1);overflow:hidden}
#ruler{position:absolute;inset:0;width:100%;height:100%}
#bodyScroll{grid-column:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0;background:var(--p1);border-right:1px solid var(--ln);scrollbar-width:thin}
#headers{width:100%}
#laneWrap{grid-column:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:#0f0f13}
#stick{position:absolute;inset:0}
#stick canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#hbar{grid-column:2;overflow-x:scroll;overflow-y:hidden;background:var(--p1);border-top:1px solid var(--ln)}
#hbarIn{height:1px}
.th{height:96px;box-sizing:border-box;border-bottom:1px solid var(--ln);padding:7px 8px;display:flex;flex-direction:column;gap:7px;position:relative}
.th.sel{background:#22222c;box-shadow:inset 3px 0 0 var(--tc,var(--ac))}
.th .row{display:flex;align-items:center;gap:6px}
.th .sw{width:12px;height:12px;border-radius:3px;background:var(--tc);flex:none}
.th .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 3px;border-radius:4px}
.th .nm:hover{background:var(--p3)}
.th input.nmEdit{flex:1;min-width:0;background:#000;border:1px solid var(--ac);border-radius:4px;padding:2px 4px}
.th .dots{padding:1px 8px;font-weight:700;letter-spacing:1px}
.th .ms{width:28px;height:26px;padding:0;font-weight:700;font-size:12px}
.th .ms.m.on{background:#ff8a3d;border-color:#ff8a3d;color:#1a0c00}.th .ms.s.on{background:#ffd54f;border-color:#ffd54f;color:#201800}
.th .vol{flex:1;min-width:0;accent-color:var(--tc,var(--ac));height:18px}
.knob{width:30px;height:30px;border-radius:50%;background:radial-gradient(#34343f,#1d1d24);border:1px solid #4a4a58;position:relative;flex:none;cursor:ns-resize;touch-action:none}
.knob i{position:absolute;left:50%;top:3px;width:2px;height:10px;margin-left:-1px;background:var(--tc,var(--ac));border-radius:1px;transform-origin:50% 12px}
.th .lbl{font-size:10px;color:var(--dim);width:34px;text-align:center}
.menu{position:fixed;z-index:50;background:#22222b;border:1px solid #3b3b49;border-radius:8px;padding:4px;min-width:190px;box-shadow:0 8px 30px #000a;max-height:80vh;overflow:auto}
.menu .mi{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:18px}.menu .mi:hover{background:#34344a}.menu .mi.dis{opacity:.35;pointer-events:none}
.menu .hint{color:var(--dim);font-size:11px}.menu .sep{height:1px;background:var(--ln);margin:4px 2px}
.menu .sws{display:flex;gap:5px;padding:6px 8px;flex-wrap:wrap;max-width:210px}.menu .sws b{width:20px;height:20px;border-radius:5px;cursor:pointer;border:2px solid transparent}.menu .sws b:hover{border-color:#fff}
.modalBg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center}
.modal{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:18px;min-width:320px;max-width:min(560px,92vw);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:15px}.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal input[type=text]{width:100%;background:#000;border:1px solid var(--ln);border-radius:6px;padding:7px 9px;font-size:14px}
.modal .bar{height:8px;background:var(--p3);border-radius:4px;overflow:hidden;margin:8px 0}.modal .bar i{display:block;height:100%;background:var(--ac);width:0}
.modal .li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--ln)}
.modal .dim{color:var(--dim);font-size:12px}
button.primary{background:var(--ac);color:#04121a;border-color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2b36;border:1px solid #444455;padding:8px 14px;border-radius:8px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;border:3px dashed var(--ac);background:#4cc2ff18;z-index:55;display:none;align-items:center;justify-content:center;font-size:22px;pointer-events:none}
#empty{position:absolute;left:272px;right:0;top:30px;bottom:14px;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:none;text-align:center;line-height:1.7}
.inl{position:fixed;z-index:65;background:#000;border:1px solid var(--ac);border-radius:4px;padding:1px 5px;font:inherit}

#main.side{grid-template-columns:272px minmax(0,1fr) 330px}
#side{grid-column:3;grid-row:1/4;display:none;flex-direction:column;background:var(--p1);border-left:1px solid var(--ln);min-height:0}
#main.side #side{display:flex}#main.side #empty{right:330px}
#side .tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--ln)}#side .tabs button{flex:1}
#side .pane{flex:1;overflow-y:auto;padding:8px;min-height:0}
#side input[type=search]{width:100%;background:#000;border:1px solid var(--ln);border-radius:6px;padding:7px 9px;margin-bottom:6px}
#side .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}#side .chips button{padding:3px 8px;font-size:12px;border-radius:12px}
.fxc{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:9px;margin-bottom:8px}
.fxc .hd{display:flex;align-items:center;gap:6px}.fxc .hd b{flex:1;cursor:pointer}
.fxc .ds{color:var(--dim);font-size:12px;margin:4px 0 6px}
.fxc button.sm{padding:2px 7px;font-size:12px}.fxc button.star.on{color:#ffd54f;background:var(--p3);border-color:#ffd54f}
.fxc.off{opacity:.55}
.prm{margin:7px 0 2px}.prm .lb{display:flex;justify-content:space-between;font-size:12px;color:#c9c9d6}.prm .lb span:last-child{color:var(--ac);font-family:ui-monospace,monospace}
.prm input[type=range]{width:100%;accent-color:var(--ac);height:18px}.prm select,.fxc select{width:100%;background:#000;border:1px solid var(--ln);border-radius:6px;padding:5px;color:var(--tx)}
.fxb{padding:1px 6px;font-size:10px;font-weight:700;color:var(--dim)}.fxb.on{color:#04121a;background:var(--ac);border-color:var(--ac)}
.empt{color:var(--dim);padding:14px 4px;line-height:1.6}

/* ---- mastering view ---- */
#masterBtn.on{background:var(--ac);color:#04121a;border-color:var(--ac)}
#mview{position:fixed;left:0;right:0;top:54px;bottom:0;z-index:20;background:var(--bg);display:flex;min-height:0}
#mview .mcol{flex:1;min-width:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
#mview .mside{width:360px;flex:0 0 360px;overflow-y:auto;padding:12px;background:var(--p1);border-left:1px solid var(--ln)}
#mview .row{display:flex;align-items:center;gap:8px}
#mview .sp{flex:1}
#mview .dim{color:var(--dim);font-size:12px}
#mview .msrc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
#mview .warnb{background:#3a2a10;color:var(--warn);border-radius:10px;padding:2px 9px;font-size:12px}
#mview .mplayer{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:9px}
#mview .seek{flex:1;accent-color:var(--ac)}
#mview .mtime{font:600 14px ui-monospace,Menlo,monospace;color:var(--ac);min-width:170px;text-align:right}
#mview .ab{display:flex;flex-wrap:wrap;gap:6px;flex:1}
#mview .abb{padding:6px 12px}#mview .abb.on{background:var(--ac);color:#04121a;border-color:var(--ac);font-weight:600}
#mview .refw{display:inline-flex;gap:2px}#mview .refw .x{padding:4px 6px;font-size:11px;color:var(--dim)}
#mview .chk{display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
#mview .mmeters{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
#mview .mcard{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;min-width:140px}
#mview .ml{font-size:11px;color:var(--dim);margin-bottom:2px}
#mview .mv{font:600 22px ui-monospace,Menlo,monospace}
#mview .tbar{height:5px;background:var(--p3);border-radius:3px;overflow:hidden;margin-top:5px}#mview .tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok) 70%,var(--warn) 90%,var(--rec))}
#mview .mviews{display:flex;gap:12px;flex-wrap:wrap}
#mview .vwrap{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px}
#mview .vwrap:first-child{flex:1 1 380px;min-width:0}#mview canvas.spec{width:100%;height:190px;display:block;background:#0b0b0e;border-radius:4px}
#mview canvas.vec{width:190px;height:190px;display:block;border-radius:4px}
#mview .mstats table,#mview .mtab{border-collapse:collapse;width:100%}
#mview .mstats{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
#mview .mstats th{font-size:11px;color:var(--dim);text-align:left;font-weight:500;padding:4px 8px}
#mview .mstats td{padding:4px 8px;border-top:1px solid var(--ln);font-variant-numeric:tabular-nums}
#mview .mfront{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
#mview .mfront h3{margin:0 0 4px}
#mview .prm.big{margin:12px 0}#mview .prm.big input{height:24px}
#mview .mempty{margin:auto;max-width:560px;text-align:center;display:flex;flex-direction:column;gap:16px;padding:20px}
#mview .mdrop{border:2px dashed var(--ln);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px;align-items:center}
#mview button.big{padding:12px 20px;font-size:15px}
#mview .fxc .hd b{cursor:default}
#mview button.primary,.modal button.primary{background:var(--ac);color:#04121a;border-color:var(--ac);font-weight:600}
.mtab td{padding:5px 8px;border-bottom:1px solid var(--ln)}.mtab td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.mute-note{color:var(--dim);font-size:12px}

#mview .mmatch .mrow{border-top:1px solid var(--ln);padding:8px 0}#mview .mmatch .mt{margin:3px 0;font-size:13px}#mview .mmatch .now{font-size:11.5px;margin-bottom:2px}#mview .mmatch select{flex:1;background:#000;border:1px solid var(--ln);border-radius:6px;padding:5px;color:var(--tx)}
textarea.mutes{width:100%;box-sizing:border-box;background:#000;border:1px solid var(--ln);border-radius:6px;padding:8px;color:var(--tx);font:13px ui-monospace,Menlo,monospace;resize:vertical;-webkit-user-select:text;user-select:text}
#mview .grrow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
#mview .grrow span{width:78px;color:var(--dim,#9a9aa6)}
#mview .grrow .tbar{flex:1}
#mview .grrow b{width:62px;text-align:right;font-variant-numeric:tabular-nums}
#mview .mdiff{margin:6px 8px}
#mview .dgrid{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
#mview .dcell{background:#1a1a20;border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:96px;font-size:12px}
#mview .dcell b{font-size:15px;font-variant-numeric:tabular-nums}
#mview .dcell b.up{color:#7fd6a0}#mview .dcell b.dn{color:#e6a46a}
#roll{position:fixed;left:0;right:0;top:54px;bottom:0;z-index:21;background:var(--bg);flex-direction:column;min-height:0}
#roll .rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--ln)}
#roll .rhint{padding:4px 12px;font-size:12px;border-bottom:1px solid var(--ln)}
#roll .rcv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
#roll select,#roll input[type=range]{background:var(--p2,#1b1b22);color:inherit;border:1px solid var(--ln);border-radius:5px;padding:3px 6px}
.a2m .a2mtypes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.a2m .a2mt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;font-size:12px}
.a2m .a2mt.on{outline:2px solid var(--accent,#29b6f6)}
.a2m .a2mrow{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.a2m .a2mrow label{width:110px;color:var(--dim,#9a9aa6)}
.a2m .a2msum{margin:10px 0 4px;padding:8px 10px;background:#17171d;border-radius:6px}

.a2m input[type=text],.a2m input[type=number]{color:#111;background:#fff;border-radius:4px;padding:2px 6px}

#lyr{position:fixed;left:0;right:0;top:54px;bottom:0;z-index:22;background:var(--bg);flex-direction:column;min-height:0}
#lyr .rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--ln)}
#lyr input[type=text],#lyr select,#lyr textarea{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:3px 6px}
#lyr .lyrTapArea{padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--p1)}
#lyr .lyrBig{text-align:center;margin-bottom:8px}
#lyr .lyrPill{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:6px;background:var(--p3);color:var(--dim)}
#lyr .lyrPill.armed{background:#12384d;color:var(--ac)}#lyr .lyrPill.timing{background:#4d3512;color:var(--warn)}#lyr .lyrPill.done{background:#123d2a;color:var(--ok)}
#lyr .lyrNow{font-size:26px;font-weight:700;min-height:34px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lyr .lyrNow.open{color:var(--warn)}
#lyr .lyrNext{font-size:20px;min-height:28px;color:var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lyr .lyrCtl,#lyr .lyrCtl2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin-top:4px}
#lyr .lyrTap{min-width:110px;padding:10px 18px;border-radius:10px;border:2px solid;font-weight:700;font-size:14px;cursor:pointer;color:var(--tx);background:var(--p2);touch-action:manipulation;user-select:none}
#lyr .lyrTap small{display:block;font-weight:400;font-size:11px;opacity:.8}#lyr .lyrTap.start{border-color:var(--ac)}#lyr .lyrTap.end{border-color:var(--warn)}
#lyr .lyrTap:active{filter:brightness(1.5)}
#lyr .lyrCv{width:100%;height:150px;flex:none;display:block;touch-action:none;border-bottom:1px solid var(--ln)}
#lyr .lyrTools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--ln)}
#lyr .lyrList{flex:1;min-height:0;overflow:auto;padding:6px 8px}
#lyr .lyrRow{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;border:1px solid transparent;cursor:pointer}
#lyr .lyrRow:hover{background:var(--p1)}#lyr .lyrRow.now{background:#16222b}#lyr .lyrRow.sel{border-color:var(--ln)}
#lyr .lyrRow.armed{border-color:var(--ac);background:#0f2430}#lyr .lyrRow.open{border-color:var(--warn);background:#2a2110}
#lyr .lyrRow.head{background:var(--p1);cursor:default}#lyr .lyrRow.head .lyrTxt{font-weight:700;color:var(--ac)}
#lyr .lyrN{width:26px;text-align:right;color:var(--dim);font-size:12px}
#lyr .lyrTxt{flex:1;min-width:120px}#lyr .lyrT{width:88px;text-align:center;font-family:ui-monospace,monospace}
#lyr .nb{padding:1px 6px}
</style></head>
<body>
<div id="app">
 <div id="top">
  <div class="grp"><a id="ianuaHome" class="btnlink" href="/" title="Back to Ianua, the Abditum launcher">&#8592; Ianua</a></div>
  <div class="grp"><button id="projBtn" title="Project menu">Project</button></div>
  <div class="grp"><button id="toStart" title="Back to start (Home)">⏮</button><button id="play" title="Play / pause (Space)">▶</button><button id="rec" title="Record from mic into a new track">● Rec</button></div>
  <div class="grp"><input id="time" value="00:00.00" title="Playhead — click to type a time (mm:ss.ss)" spellcheck="false"></div>
  <div class="grp"><button id="toolClip" title="Clip tool (V): move, trim, fade clips">Clip</button><button id="toolRange" title="Range tool (R): highlight a section">Range</button><button id="snap" title="Snap to clip edges, markers, playhead">Snap</button></div>
  <div class="grp"><button id="zout" title="Zoom out (−)">−</button><button id="zfit" title="Fit project">Fit</button><button id="zin" title="Zoom in (+)">+</button></div>
  <div class="grp"><button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button></div>
  <div class="grp"><button id="fxBtn" title="Effects library and track effect chain">Effects</button><button id="masterBtn" title="Mastering: master a finished song or this project's mix">Master</button><button id="add" title="Add empty track">+ Track</button><button id="import" title="Import audio (or drop files anywhere)">Import</button><button id="export" class="primary" title="Export mix as WAV, 48 kHz / 24-bit">Export mix</button></div>
  <div class="grp" style="margin-left:auto"><div id="meter" title="Master level"><div id="meterFill"></div></div></div>
  <div class="grp"><div id="mem"><span id="memTxt">Memory</span><div id="memBar"><div id="memFill"></div></div></div></div>
  <div class="grp"><span id="save">Saved</span></div>
 </div>
 <div id="main">
  <div id="corner"><span>Tracks</span></div>
  <div id="rulerWrap"><canvas id="ruler"></canvas></div>
  <div id="bodyScroll"><div id="headers"></div></div><div id="laneWrap"><div id="stick"><canvas id="lanes"></canvas><canvas id="over"></canvas></div></div>
  <div id="empty">Drop audio files anywhere to import them,<br>or use <b>Import</b> / <b>● Rec</b> above.</div>
  <div style="background:var(--p1);border-top:1px solid var(--ln)"></div><div id="hbar"><div id="hbarIn"></div></div>
  <aside id="side"></aside>
 </div>
</div>
<div id="mview" style="display:none"></div>
<div id="roll" style="display:none"></div><div id="lyr" style="display:none"></div>
<div id="toast"></div><div id="drop">Drop audio to import</div>
<script>
'use strict';
// ---- constants & helpers -------------------------------------------------
const SR = 48000;            // project sample rate
const CHUNK = 480000;        // frames per storage chunk (10 s)
const PK0 = 120, PK1 = 1920; // samples per waveform peak (fine / coarse)
const MINLEN = 480;          // shortest clip (10 ms)
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smp = s => Math.round(s * SR);
const pad2 = n => String(n).padStart(2, '0');
const uid = p => p + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));

// timeline time format: mm:ss.ss (internal unit = samples @ 48 kHz)
function fmtTime(samples) {
  const cs = Math.round(Math.max(0, samples) / SR * 100);
  return pad2(Math.floor(cs / 6000)) + ':' + pad2(Math.floor(cs % 6000 / 100)) + '.' + pad2(cs % 100);
}
function parseTime(str) {
  str = String(str).trim(); if (!str) return null;
  const parts = str.split(':'); if (parts.length > 3) return null;
  let s = 0;
  for (const p of parts) { const v = parseFloat(p); if (isNaN(v) || v < 0) return null; s = s * 60 + v; }
  return smp(s);
}
function fmtBytes(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(0) + ' MB'; }
const volToGain = p => p <= 0 ? 0 : p >= 0.8 ? Math.pow(10, (p - 0.8) / 0.2 * 6 / 20) : Math.pow(10, (-60 * (1 - p / 0.8)) / 20);
const volToDb = p => p <= 0 ? '-∞' : ((p >= 0.8 ? (p - 0.8) / 0.2 * 6 : -60 * (1 - p / 0.8)).toFixed(1));
function safeName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, '_').trim() || 'untitled'; }

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

// ---- UI kit: toast, menus, modals, inline edit -----------------------------
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
let curMenu = null;
function closeMenu() { if (curMenu) { curMenu.remove(); curMenu = null; } }
addEventListener('pointerdown', e => { if (curMenu && !curMenu.contains(e.target)) closeMenu(); }, true);
function popMenu(x, y, items) {
  closeMenu();
  const m = h('div', { class: 'menu' });
  for (const it of items) {
    if (!it) continue;
    if (it === '-') m.append(h('div', { class: 'sep' }));
    else if (it.colors) m.append(h('div', { class: 'sws' }, it.colors.map(c => h('b', { style: 'background:' + c, onclick: () => { closeMenu(); it.pick(c); } }))));
    else m.append(h('div', { class: 'mi' + (it.disabled ? ' dis' : ''), onclick: () => { closeMenu(); it.fn && it.fn(); } }, h('span', null, it.label), it.hint ? h('span', { class: 'hint' }, it.hint) : null));
  }
  document.body.append(m); curMenu = m;
  const r = m.getBoundingClientRect();
  m.style.left = clamp(x, 4, innerWidth - r.width - 4) + 'px';
  m.style.top = clamp(y, 4, innerHeight - r.height - 4) + 'px';
}
function modal(title, content, buttons) {
  const bg = h('div', { class: 'modalBg' });
  const box = h('div', { class: 'modal' }, h('h3', null, title), content);
  const api = { el: box, close() { bg.remove(); } };
  if (buttons) box.append(h('div', { class: 'btns' }, buttons.map(b => h('button', { class: b.primary ? 'primary' : '', onclick: () => { if (b.fn) b.fn(api); if (!b.keep) api.close(); } }, b.label))));
  bg.append(box); document.body.append(bg);
  return api;
}
function askText(title, val, hint) {
  return new Promise(res => {
    const inp = h('input', { type: 'text', value: val || '' });
    const done = v => { m.close(); res(v); };
    const m = modal(title, h('div', null, inp, hint ? h('div', { class: 'dim', style: 'margin-top:6px' }, hint) : null),
      [{ label: 'Cancel', fn: () => res(null) }, { label: 'OK', primary: true, keep: true, fn: () => done(inp.value) }]);
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); });
    setTimeout(() => { inp.focus(); inp.select(); }, 20);
  });
}
function progress(title) {
  const bar = h('i'), msg = h('div', { class: 'dim' }, '');
  const m = modal(title, h('div', { style: 'min-width:300px' }, h('div', { class: 'bar' }, bar), msg));
  return { set(f, t) { bar.style.width = (clamp(f, 0, 1) * 100).toFixed(1) + '%'; if (t != null) msg.textContent = t; }, close: m.close };
}
function inlineEdit(rect, value, done) {
  const inp = h('input', { class: 'inl', value, style: `left:${rect.left}px;top:${rect.top}px;width:${Math.max(rect.width, 120)}px;height:${rect.height}px` });
  let fin = false;
  const end = ok => { if (fin) return; fin = true; const v = inp.value; inp.remove(); if (ok && v.trim()) done(v.trim()); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') end(true); if (e.key === 'Escape') end(false); });
  inp.addEventListener('blur', () => end(true));
  document.body.append(inp); inp.focus(); inp.select();
}

// ---- local storage (Origin Private File System) --------------------------------
// projects/<pid>/project.json   current state (atomic swap writes)
// projects/<pid>/snaps/<ts>.json rolling snapshots
// projects/<pid>/a/<aid>/c<n>.f32  audio in 10 s chunks, stereo interleaved float32 @48k
// projects/<pid>/a/<aid>/peaks.i16 fine waveform peaks
const Store = {
  root: null, q: Promise.resolve(),
  async init() {
    this.root = await navigator.storage.getDirectory();
    try { await navigator.storage.persist(); } catch (e) { }
  },
  async dir(path, create = true) {
    let d = this.root;
    for (const p of path.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p, { create });
    return d;
  },
  writeFile(path, data) { // serialized, each write is atomic (swap file committed on close)
    const run = async () => {
      const i = path.lastIndexOf('/');
      const d = await this.dir(path.slice(0, i));
      const fh = await d.getFileHandle(path.slice(i + 1), { create: true });
      const w = await fh.createWritable(); await w.write(data); await w.close();
    };
    const p = this.q.then(run); this.q = p.catch(() => { }); return p;
  },
  async readFile(path) {
    try {
      const i = path.lastIndexOf('/');
      const d = await this.dir(path.slice(0, i), false);
      return await (await d.getFileHandle(path.slice(i + 1))).getFile();
    } catch (e) { return null; }
  },
  async readJSON(path) { const f = await this.readFile(path); if (!f) return null; try { return JSON.parse(await f.text()); } catch (e) { return null; } },
  async list(path) {
    const out = [];
    try { const d = await this.dir(path, false); for await (const [name, handle] of d.entries()) out.push({ name, kind: handle.kind }); } catch (e) { }
    return out;
  },
  async remove(path) {
    try {
      const i = path.lastIndexOf('/');
      const d = await this.dir(path.slice(0, i), false);
      await d.removeEntry(path.slice(i + 1), { recursive: true });
    } catch (e) { }
  },
  async writeChunk(pid, aid, n, f32) { return this.writeFile(`projects/${pid}/a/${aid}/c${n}.f32`, f32); },
  async readChunk(pid, aid, n) {
    const f = await this.readFile(`projects/${pid}/a/${aid}/c${n}.f32`);
    if (!f) return null;
    const ab = await f.arrayBuffer();
    return new Float32Array(ab, 0, ab.byteLength >> 3 << 1);
  },
  async listProjects() {
    const out = [];
    for (const e of await this.list('projects')) {
      if (e.kind !== 'directory') continue;
      const p = await this.readJSON(`projects/${e.name}/project.json`);
      if (p) out.push({ id: e.name, name: p.name, saved: p.saved || 0 });
    }
    return out.sort((a, b) => b.saved - a.saved);
  },
  async listSnaps(pid) {
    return (await this.list(`projects/${pid}/snaps`)).filter(e => e.name.endsWith('.json')).map(e => parseInt(e.name)).sort((a, b) => b - a);
  },
  async pruneSnaps(pid, keep) {
    const s = await this.listSnaps(pid);
    for (const ts of s.slice(keep)) await this.remove(`projects/${pid}/snaps/${ts}.json`);
  },
  async loadProject(pid) {
    let p = await this.readJSON(`projects/${pid}/project.json`);
    if (!p) { const s = await this.listSnaps(pid); for (const ts of s) { p = await this.readJSON(`projects/${pid}/snaps/${ts}.json`); if (p) break; } }
    return p;
  },
  async deleteProject(pid) { await this.remove('projects/' + pid); },
  async usage() { try { const e = await navigator.storage.estimate(); return e; } catch (e) { return {}; } }
};

// ---- waveform peaks ------------------------------------------------------------
// per chunk: Int16 [min,max] per PK0 samples (chunk = 4000 peaks). Level 1 is 16x coarser.
const Peaks = {
  map: new Map(),
  chunkPeaks(f32) {
    const frames = f32.length >> 1, n = Math.ceil(frames / PK0), out = new Int16Array(n * 2);
    for (let p = 0; p < n; p++) {
      let mn = 1, mx = -1; const a = p * PK0, b = Math.min(frames, a + PK0);
      for (let i = a; i < b; i++) {
        const l = f32[2 * i], r = f32[2 * i + 1];
        if (l < mn) mn = l; if (r < mn) mn = r; if (l > mx) mx = l; if (r > mx) mx = r;
      }
      out[2 * p] = Math.round(mn * 32767); out[2 * p + 1] = Math.round(mx * 32767);
    }
    return out;
  },
  setPart(aid, n, arr) {
    let e = this.map.get(aid); if (!e) { e = { parts: [], l0: null, l1: null }; this.map.set(aid, e); }
    e.parts[n] = arr; e.l0 = e.l1 = null;
  },
  setL0(aid, l0) { this.map.set(aid, { parts: null, l0, l1: null }); },
  get(aid) {
    const e = this.map.get(aid); if (!e) return null;
    if (!e.l0) {
      let tot = 0; for (const p of e.parts) tot += p ? p.length : 0;
      e.l0 = new Int16Array(tot); let o = 0; for (const p of e.parts) if (p) { e.l0.set(p, o); o += p.length; }
    }
    if (!e.l1) {
      const n0 = e.l0.length >> 1, n1 = Math.ceil(n0 / 16), l1 = new Int16Array(n1 * 2);
      for (let i = 0; i < n1; i++) {
        let mn = 32767, mx = -32768; const b = Math.min(n0, i * 16 + 16);
        for (let j = i * 16; j < b; j++) { if (e.l0[2 * j] < mn) mn = e.l0[2 * j]; if (e.l0[2 * j + 1] > mx) mx = e.l0[2 * j + 1]; }
        l1[2 * i] = mn; l1[2 * i + 1] = mx;
      }
      e.l1 = l1;
    }
    return e;
  },
  async persist(pid, aid) { const e = this.get(aid); if (e) await Store.writeFile(`projects/${pid}/a/${aid}/peaks.i16`, e.l0); },
  async load(pid, aid, frames) {
    const f = await Store.readFile(`projects/${pid}/a/${aid}/peaks.i16`);
    if (f && f.size >= 8) { const ab = await f.arrayBuffer(); this.setL0(aid, new Int16Array(ab, 0, ab.byteLength >> 2 << 1)); return; }
    // missing: rebuild from audio
    const nch = Math.ceil(frames / CHUNK);
    for (let n = 0; n < nch; n++) { const c = await Store.readChunk(pid, aid, n); if (c) this.setPart(aid, n, this.chunkPeaks(c)); }
    await this.persist(pid, aid);
  },
  bytes() { let b = 0; for (const e of this.map.values()) b += (e.l0 ? e.l0.byteLength : 0) + (e.l1 ? e.l1.byteLength : 0); return b; }
};

// ---- autosave ---------------------------------------------------------------------
const Save = {
  timer: null, dirty: false, chain: Promise.resolve(), lastSnap: 0,
  mark() { this.dirty = true; setStatus('Saving…'); if (!this.timer) this.timer = setTimeout(() => this.now(), 700); },
  serialize() {
    const view = { ...P.view, ph: Engine.playing ? Math.round(Engine.pos()) : P.view.ph };
    P.ui.selTracks = [...UI.selTracks]; P.ui.selClips = [...UI.selClips]; P.ui.tool = UI.tool; P.ui.snap = UI.snap;
    return JSON.stringify({ ...P, view, saved: Date.now() });
  },
  now(force) {
    clearTimeout(this.timer); this.timer = null;
    if (!P || (!this.dirty && !force)) return this.chain;
    this.dirty = false;
    const json = this.serialize(), pid = P.id;
    this.chain = this.chain.then(async () => {
      try {
        await Store.writeFile(`projects/${pid}/project.json`, json);
        const now = Date.now();
        if (now - this.lastSnap > 90000) {
          this.lastSnap = now;
          await Store.writeFile(`projects/${pid}/snaps/${now}.json`, json);
          await Store.pruneSnaps(pid, 5);
        }
        if (!this.dirty) setStatus('Saved');
      } catch (e) { console.error('save failed', e); setStatus('Save failed!', true); this.dirty = true; }
    });
    return this.chain;
  }
};
function setStatus(t, err) { const s = $('#save'); if (s) { s.textContent = t; s.classList.toggle('err', !!err); } }
addEventListener('pagehide', () => Save.now(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.now(true); });
setInterval(() => { if (Save.dirty) Save.now(); }, 15000);

// ---- audio engine ------------------------------------------------------------------
// Playback streams 10 s chunks from storage and schedules them ~2.5 s ahead, so memory stays
// small and constant no matter how many/long the tracks are.
const Cache = { // decoded chunk cache (AudioBuffers), bounded by bytes
  map: new Map(), bytes: 0, limit: 80 << 20, pend: new Map(),
  async get(aid, n) {
    const k = aid + ':' + n, m = this.map.get(k);
    if (m) { this.map.delete(k); this.map.set(k, m); return m; }
    let p = this.pend.get(k); if (p) return p;
    p = (async () => {
      const f = await Store.readChunk(P.id, aid, n); if (!f) return null;
      const frames = f.length >> 1, b = Engine.ctx.createBuffer(2, frames, SR);
      const l = b.getChannelData(0), r = b.getChannelData(1);
      for (let i = 0, j = 0; i < frames; i++) { l[i] = f[j++]; r[i] = f[j++]; }
      this.map.set(k, b); this.bytes += frames * 8; this.trim(); return b;
    })();
    this.pend.set(k, p);
    try { return await p; } finally { this.pend.delete(k); }
  },
  trim() { for (const [k, b] of this.map) { if (this.bytes <= this.limit) break; this.map.delete(k); this.bytes -= b.length * 8; } },
  clear() { this.map.clear(); this.bytes = 0; }
};

// Track graph — used for BOTH live playback and offline export so they sound identical.
//   in -> [effects chain] -> vol -> pan -> out -> dest
function buildTrackGraph(ctx, tr, dest) {
  const inn = ctx.createGain(), vol = ctx.createGain(), pan = ctx.createStereoPanner(), mg = ctx.createGain(), out = ctx.createGain();
  inn.connect(vol); vol.connect(pan); pan.connect(mg); mg.connect(out); out.connect(dest); // mg = muted-section automation
  vol.gain.value = volToGain(tr.vol); pan.pan.value = tr.pan;
  return { inn, vol, pan, mg, out };
}
// fade/gain automation for one clip; p0 = timeline sample where we start; tAt maps sample -> context time
function applyClipAuto(g, c, p0, tAt) {
  const end = c.start + c.len, fi = c.fadeIn || 0, fo = c.fadeOut || 0, G = c.gain == null ? 1 : c.gain, gp = g.gain;
  const val = p => { let v = 1; if (fi > 0 && p < c.start + fi) v = Math.min(v, (p - c.start) / fi); if (fo > 0 && p > end - fo) v = Math.min(v, (end - p) / fo); return G * Math.max(0, v); };
  gp.setValueAtTime(val(p0), tAt(p0));
  if (fi > 0 && p0 < c.start + fi) gp.linearRampToValueAtTime(G, tAt(c.start + fi));
  if (fo > 0) { if (p0 < end - fo) gp.setValueAtTime(G, tAt(end - fo)); gp.linearRampToValueAtTime(0, tAt(end)); }
}

const REC_WORKLET = `class R extends AudioWorkletProcessor{constructor(){super();this.n=0;this.l=new Float32Array(4096);this.r=new Float32Array(4096)}
process(inp){const i=inp[0];if(!i||!i.length)return true;const a=i[0],b=i[1]||i[0];for(let k=0;k<a.length;k++){this.l[this.n]=a[k];this.r[this.n]=b[k];this.n++;
if(this.n===4096){this.port.postMessage({l:this.l,r:this.r},[this.l.buffer,this.r.buffer]);this.l=new Float32Array(4096);this.r=new Float32Array(4096);this.n=0}}return true}}
registerProcessor('rec-proc',R)`;

const Engine = {
  ctx: null, master: null, analyser: null, nodes: new Map(), cs: new Map(),
  playing: false, startS: 0, t0: 0, timer: null, busy: false, gen: 0, LOOK: 2.5, rec: null, workletReady: false,
  init() {
    this.ctx = new AudioContext({ sampleRate: SR, latencyHint: 'playback' });
    this.master = this.ctx.createGain(); this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 1024;
    this.master.connect(this.analyser); this.analyser.connect(this.ctx.destination);
    this.fxReady = ensureFxWorklet(this.ctx);
  },
  tAt(p) { return this.t0 + (p - this.startS) / SR; },
  schedPos() { return this.startS + Math.max(0, (this.ctx.currentTime - this.t0) * SR); },
  pos() { if (!this.playing) return P.view.ph; return this.startS + Math.max(0, (this.ctx.currentTime - this.t0 - (this.ctx.outputLatency || 0)) * SR); },
  // ---- mixer state
  syncTracks() {
    const ids = new Set(P.tracks.map(t => t.id));
    for (const [id, n] of this.nodes) if (!ids.has(id)) { for (const i of n.fx.values()) i.dispose(); try { n.out.disconnect(); } catch (e) { } this.nodes.delete(id); }
    for (const t of P.tracks) if (!this.nodes.has(t.id)) { const nd = buildTrackGraph(this.ctx, t, this.master); nd.fx = new Map(); nd.sig = ''; this.nodes.set(t.id, nd); }
    for (const t of P.tracks) this.syncFx(t, this.nodes.get(t.id));
    this.applyParams();
  },
  syncFx(tr, nd) {
    const want = new Set((tr.fx || []).map(f => f.id));
    for (const [id, inst] of nd.fx) if (!want.has(id)) { inst.dispose(); nd.fx.delete(id); }
    for (const f of tr.fx || []) if (!nd.fx.has(f.id)) { try { nd.fx.set(f.id, Effects.create(this.ctx, f)); } catch (e) { console.error('fx', e); } }
    const live = (tr.fx || []).filter(f => nd.fx.has(f.id));
    const sig = live.map(f => f.id + (f.on === false ? 0 : 1)).join();
    if (nd.sig !== sig) { wireChain(nd, live.filter(f => f.on !== false).map(f => nd.fx.get(f.id))); nd.sig = sig; }
  },
  updateFx(tid, fx) { const nd = this.nodes.get(tid), i = nd && nd.fx.get(fx.id); if (i) i.update(Effects.full(fx)); },
  applyParams() {
    const solo = P.tracks.some(t => t.solo), now = this.ctx.currentTime;
    for (const t of P.tracks) {
      const n = this.nodes.get(t.id); if (!n) continue;
      n.vol.gain.setTargetAtTime(volToGain(t.vol), now, 0.01);
      n.pan.pan.setTargetAtTime(t.pan, now, 0.01);
      n.out.gain.setTargetAtTime(isAudible(t, solo) ? 1 : 0, now, 0.01);
    }
  },
  // ---- transport
  async play() {
    await this.ctx.resume(); if (typeof MP !== 'undefined') MP.pause();
    if (this.playing) return;
    this.begin(P.view.ph);
  },
  begin(s) {
    this.stopSources();
    this.startS = Math.max(0, Math.round(s));
    this.t0 = Math.ceil((this.ctx.currentTime + 0.08) * SR) / SR;
    this.playing = true; this.setFxActive(true); this.scheduleMutes(this.startS);
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 90); this.tick();
  },
  pause() {
    if (!this.playing) return;
    P.view.ph = Math.round(this.pos());
    this.stopSources(); this.playing = false; this.setFxActive(false); this.clearMutes(); clearInterval(this.timer); Save.mark();
  },
  seek(s) { s = Math.max(0, Math.round(s)); if (this.playing) this.begin(s); else P.view.ph = s; },
  resched() { if (this.playing) { const p = this.schedPos(); this.begin(p); } },
  setFxActive(a) { for (const nd of this.nodes.values()) for (const i of nd.fx.values()) if (i.setActive) i.setActive(a); },
  stopSources() {
    for (const st of this.cs.values()) {
      for (const s of st.srcs) { try { s.stop(); s.disconnect(); } catch (e) { } }
      if (st.g) try { st.g.disconnect(); } catch (e) { }
    }
    this.cs.clear(); this.gen++;
  },
  async tick() {
    if (!this.playing || this.busy) return;
    this.busy = true; const gen = this.gen;
    try {
      const now = this.schedPos(), win = now + this.LOOK * SR;
      for (const tr of P.tracks) {
        const nd = this.nodes.get(tr.id); if (!nd) continue;
        for (const c of tr.clips) {
          const end = c.start + c.len; if (end <= now || c.start >= win) continue;
          let st = this.cs.get(c.id);
          if (!st) { st = { next: Math.max(c.start, Math.floor(now)), g: null, srcs: [] }; this.cs.set(c.id, st); }
          const limit = Math.min(end, win);
          if (c.midi) {
            if (st.next < limit) {
              if (!st.g) { st.g = this.ctx.createGain(); st.g.connect(nd.inn); applyClipAuto(st.g, c, st.next, p => this.tAt(p)); }
              Synth.scheduleClip(this.ctx, st.g, c, tr.inst || 'keys', st.next, limit, f => this.tAt(f), st.srcs, this.ctx.currentTime - 0.01); st.next = limit;
            }
            continue;
          }
          while (st.next < limit) {
            const n = Math.floor((c.offset + st.next - c.start) / CHUNK);
            const buf = await Cache.get(c.aid, n);

// ---- project model, history, edit operations ----------------------------------------
let P = null; // current project (plain JSON)
const TRACK_COLORS = ['#ef5350', '#ff7043', '#ffa726', '#ffd54f', '#9ccc65', '#26a69a', '#29b6f6', '#5c6bc0', '#ab47bc', '#ec407a'];
const UI = { selTracks: new Set(), selClips: new Set(), range: null, tool: 'clip', snap: true, dirty: true, clipboard: null, selMarker: null };

function newProject(name) {
  return { v: 1, id: uid('p'), name: name || 'Untitled project', sr: SR, tracks: [], markers: [], assets: {},
    view: { pps: 60, scroll: 0, vscroll: 0, ph: 0 }, settings: { recOffsetMs: 0 }, ui: { tool: 'clip', snap: true, selTracks: [], selClips: [] }, created: Date.now() };
}
function newTrack(name) {
  const i = P.tracks.length;
  return { id: uid('t'), name: name || 'Track ' + (i + 1), color: TRACK_COLORS[i % TRACK_COLORS.length], mute: false, solo: false, vol: 0.8, pan: 0, clips: [], fx: [] };
}
function newClip(aid, start, offset, len, name) { return { id: uid('c'), aid, start, offset, len, fadeIn: 0, fadeOut: 0, gain: 1, name }; }
const projectEnd = () => { let e = 0; for (const t of P.tracks) for (const c of t.clips) e = Math.max(e, c.start + c.len); return e; };
const trackOf = id => P.tracks.find(t => t.id === id);
function findClip(id) { for (const t of P.tracks) { const c = t.clips.find(c => c.id === id); if (c) return { t, c }; } return null; }

// undo/redo (project structure only; audio assets are immutable)
const H = {
  undo: [], redo: [],
  snap() { return JSON.stringify({ tracks: P.tracks, markers: P.markers, mutes: P.mutes || [] }); },
  push() { if (this.undo.length > 100) this.undo.shift(); this.undo.push(this.snap()); this.redo.length = 0; syncUndoBtns(); },
  doUndo() { if (!this.undo.length || Engine.rec) return; this.redo.push(this.snap()); this.restore(this.undo.pop()); },
  doRedo() { if (!this.redo.length || Engine.rec) return; this.undo.push(this.snap()); this.restore(this.redo.pop()); },
  restore(s) { const o = JSON.parse(s); P.tracks = o.tracks; P.markers = o.markers; P.mutes = o.mutes || []; cleanSel(); afterEdit({ structure: true, headers: true }); syncUndoBtns(); },
  clear() { this.undo.length = 0; this.redo.length = 0; syncUndoBtns(); }
};
function cleanSel() {
  const tids = new Set(P.tracks.map(t => t.id)), cids = new Set(P.tracks.flatMap(t => t.clips.map(c => c.id)));
  UI.selTracks = new Set([...UI.selTracks].filter(i => tids.has(i)));
  UI.selClips = new Set([...UI.selClips].filter(i => cids.has(i)));
  if (UI.range && !UI.range.tids.some(i => tids.has(i))) UI.range = null;
}
function afterEdit(o = {}) {
  Engine.syncTracks();
  if (o.structure) Engine.resched();
  if (o.headers) buildHeaders();
  Save.mark(); UI.dirty = true; updateEmpty(); FXUI.refresh();
}

const Ops = {
  addTrack(name) { H.push(); const t = newTrack(name); P.tracks.push(t); UI.selTracks = new Set([t.id]); afterEdit({ structure: true, headers: true }); return t; },
  async importInto(files, track) {
    files = [...files].filter(f => f.size > 0); if (!files.length) return;
    const pr = progress('Importing audio'); let k = 0;
    try {
      for (const f of files) {
        pr.set(k / files.length, `Converting ${f.name} to 48 kHz…`);
        let aid;
        try { aid = await Engine.importFile(f, p => pr.set((k + p) / files.length)); } catch (e) { toast(e.message, 4000); k++; continue; }
        H.push();
        const a = P.assets[aid]; let tr = track;
        if (!tr) { tr = newTrack(a.name); P.tracks.push(tr); }
        const c = newClip(aid, P.view.ph, 0, a.frames, a.name); tr.clips.push(c);
        UI.selTracks = new Set([tr.id]); UI.selClips = new Set([c.id]);
        afterEdit({ structure: true, headers: true }); k++;
      }
    } finally { pr.close(); }
    await Save.now(true);
  },
  split(c, tr, at) {
    const end = c.start + c.len;
    if (at <= c.start + MINLEN || at >= end - MINLEN) return null;
    const rel = at - c.start, r = { ...c, id: uid('c'), start: at, offset: c.offset + rel, len: c.len - rel, fadeIn: 0 };
    c.len = rel; c.fadeOut = 0; tr.clips.push(r); return r;
  },
  splitAtPlayhead() {
    const at = Math.round(Engine.playing ? Engine.pos() : P.view.ph);
    let targets = [];
    if (UI.selClips.size) for (const id of UI.selClips) { const f = findClip(id); if (f) targets.push(f); }
    else for (const t of P.tracks) { if (UI.selTracks.size && !UI.selTracks.has(t.id)) continue; for (const c of t.clips) if (at > c.start && at < c.start + c.len) targets.push({ t, c }); }
    targets = targets.filter(({ c }) => at > c.start + MINLEN && at < c.start + c.len - MINLEN);
    if (!targets.length) { toast('Nothing to split at the playhead'); return; }

  addEventListener('keydown', e => {

    else if (ctrl && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? H.doRedo() : H.doUndo(); }
    else if (ctrl && k.toLowerCase() === 'y') { e.preventDefault(); H.doRedo(); }
    else if (ctrl && k.toLowerCase() === 'c') { e.preventDefault(); Ops.copy(false); }
    else if (ctrl && k.toLowerCase() === 'x') { e.preventDefault(); Ops.copy(true); }
    else if (ctrl && k.toLowerCase() === 'v') { e.preventDefault(); Ops.paste(); }
    else if (ctrl && k.toLowerCase() === 'd') { e.preventDefault(); Ops.duplicateClips(UI.selClips); }
    else if (ctrl && k.toLowerCase() === 'a') { e.preventDefault(); UI.selClips = new Set(P.tracks.flatMap(t => t.clips.map(c => c.id))); UI.dirty = true; }
    else if (k === 's' || k === 'S') { if (!ctrl) Ops.splitAtPlayhead(); }

    else if (k === 'm' || k === 'M') { Ops.addMarker(Math.round(curPos())); }
    else if (k === 'v' || k === 'V') { UI.tool = 'clip'; updateToolBtns(); }
    else if (k === 'r' || k === 'R') { UI.tool = 'range'; updateToolBtns(); }
    else if (k === '+' || k === '=') zoomAt(W / 2, 1.5);
    else if (k === '-' || k === '_') zoomAt(W / 2, 1 / 1.5);
    else if (k === 'Home') { Engine.seek(0); setScroll(0); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); Engine.seek(curPos() + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? SR : SR * 0.1)); UI.odirty = true; }

  });
}
